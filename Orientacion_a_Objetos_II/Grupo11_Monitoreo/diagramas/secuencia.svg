<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="1220" viewBox="0 0 1550 1220" role="img">
<title>UML de secuencia — modificar temperatura</title>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#18384c" stroke-width="1.5"/></marker>
<marker id="herencia" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M1,1 L15,8 L1,15 Z" fill="white" stroke="#18384c"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="775" y="32" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#142f41" text-anchor="middle" font-weight="bold">SECUENCIA · cambio de temperatura en Sala A</text>
<rect x="10" y="65" width="180" height="75" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="100.0" y="95" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Usuario</text>
<path d="M100,140 V1100" fill="none" stroke="#18384c" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="220" y="65" width="220" height="75" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="330.0" y="95" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Consola</text>
<path d="M330,140 V1100" fill="none" stroke="#18384c" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="470" y="65" width="220" height="75" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="580.0" y="95" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Sensor Sala A</text>
<path d="M580,140 V1100" fill="none" stroke="#18384c" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="745" y="65" width="220" height="75" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="855.0" y="95" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Operador</text>
<path d="M855,140 V1100" fill="none" stroke="#18384c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="855" y="121" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142f41" text-anchor="middle" font-weight="normal">ObservadorConsola</text>
<rect x="1000" y="65" width="220" height="75" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="1110.0" y="95" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Supervisor</text>
<path d="M1110,140 V1100" fill="none" stroke="#18384c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1110" y="121" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142f41" text-anchor="middle" font-weight="normal">ObservadorConsola</text>
<rect x="1290" y="65" width="220" height="75" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="1400.0" y="95" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Estrategia activa</text>
<path d="M1400,140 V1100" fill="none" stroke="#18384c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1400" y="121" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#142f41" text-anchor="middle" font-weight="normal">EvaluacionTemperatura</text>
<text x="775" y="175" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="middle" font-weight="normal">Precondición: 22 °C / 45 %, iniciado, dos observadores, criterio temperatura &gt;30 °C</text>
<path d="M100,220 H330" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="215.0" y="210" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">Cambiar a 31 °C</text>
<path d="M330,295 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="455.0" y="285" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">cambiar_mediciones(31,45)</text>
<path d="M580,340 H630 V372 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="650" y="358" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">Validar y guardar 31 °C / 45 %</text>
<path d="M580,400 H630 V432 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="650" y="418" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">_notificar()</text>
<path d="M580,480 H855" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="717.5" y="470" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">actualizar(nombre,ubicacion,31,45)</text>
<path d="M580,555 H1110" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="845.0" y="545" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">actualizar(nombre,ubicacion,31,45)</text>
<text x="1050" y="600" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">Cada observador imprime el nuevo par de valores</text>
<path d="M580,645 H630 V677 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="650" y="663" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">_evaluar()</text>
<path d="M580,725 H1400" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="990.0" y="715" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">evaluar(31,45)</text>
<path d="M1400,790 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)" stroke-dasharray="8 6"/>
<text x="990.0" y="780" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">True (31 &gt;30)</text>
<path d="M580,840 H630 V872 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="650" y="858" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">Guardar resultado=True; estado=Alerta generada</text>
<path d="M580,920 H330" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)" stroke-dasharray="8 6"/>
<text x="455.0" y="910" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">True</text>
<path d="M330,980 H580" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="455.0" y="970" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">resumen()</text>
<path d="M580,1040 H330" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)" stroke-dasharray="8 6"/>
<text x="455.0" y="1030" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">datos, criterio, ALERTA, estado</text>
<path d="M330,1100 H100" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)" stroke-dasharray="8 6"/>
<text x="215.0" y="1090" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">Mostrar resultado</text>
<text x="50" y="1160" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">Observer: dos llamadas actualizar. Strategy: delegación evaluar. El orden es guardar → avisar → evaluar.</text>
<text x="50" y="1195" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">Retornos discontinuos. nombre/ubicacion = Sala A / Planta baja. La secuencia no notifica el resultado posterior.</text>
</svg>