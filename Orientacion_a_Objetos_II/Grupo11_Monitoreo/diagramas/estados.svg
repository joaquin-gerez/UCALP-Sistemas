<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img">
<title>UML de estados — ciclo del Sensor</title>
<defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#18384c" stroke-width="1.5"/></marker>
<marker id="herencia" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M1,1 L15,8 L1,15 Z" fill="white" stroke="#18384c"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<text x="750" y="32" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#142f41" text-anchor="middle" font-weight="bold">ESTADOS · un Sensor (estado observable al retornar)</text>
<circle cx="750" cy="70" r="9" fill="#18384c"/>
<path d="M750,79 V150" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="440" y="115" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">construir / resultado=None</text>
<rect x="530" y="150" width="440" height="70" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="750.0" y="180" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Configurado</text>
<path d="M970,185 H1300 V95 H920 V150" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="1050" y="135" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">cambiar_estrategia</text>
<text x="1050" y="163" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">/ seleccionar sin evaluar</text>
<rect x="120" y="470" width="450" height="80" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="345.0" y="500" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Monitoreando</text>
<rect x="930" y="470" width="450" height="80" rx="8" fill="#f1f7fa" stroke="#18384c" stroke-width="2"/>
<text x="1155.0" y="500" font-family="DejaVu Sans, sans-serif" font-size="21" fill="#142f41" text-anchor="middle" font-weight="bold">Alerta generada</text>
<path d="M580,220 V300 H345 V470" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="50" y="345" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">iniciar [2+ observadores</text>
<text x="50" y="375" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">y evaluación normal]</text>
<path d="M920,220 V300 H1155 V470" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="850" y="345" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">iniciar [2+ observadores</text>
<text x="850" y="375" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="start" font-weight="normal">y evaluación alerta]</text>
<path d="M570,490 H930" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="750" y="453" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="middle" font-weight="normal">reevaluar [alerta]</text>
<text x="750" y="477" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">/ resultado=True</text>
<path d="M930,535 H570" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="750" y="570" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#142f41" text-anchor="middle" font-weight="normal">reevaluar [normal]</text>
<text x="750" y="596" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="middle" font-weight="normal">/ resultado=False</text>
<path d="M120,510 H55 V660 H345 V550" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="85" y="700" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">reevaluar [normal] / resultado=False</text>
<path d="M1380,510 H1445 V660 H1155 V550" fill="none" stroke="#18384c" stroke-width="2" marker-end="url(#flecha)"/>
<text x="1020" y="700" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#142f41" text-anchor="start" font-weight="normal">reevaluar [alerta] / resultado=True</text>
<text x="60" y="770" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#142f41" text-anchor="start" font-weight="bold">«reevaluar» abrevia dos eventos públicos (no es un método adicional):</text>
<text x="60" y="815" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">• cambiar_mediciones [par diferente] / validar → guardar → notificar → _evaluar</text>
<text x="60" y="848" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">• cambiar_estrategia / seleccionar → _evaluar (sin avisos de medición)</text>
<text x="60" y="881" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">Mismos datos: mismo estado, no notifica ni evalúa. Registrar/remover observadores: no cambia estado.</text>
<text x="60" y="914" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">Rechazos sin transición: iniciar con menos de dos; cambiar datos en Configurado; volver a iniciar.</text>
<text x="60" y="947" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">No hay estado final ni botón de reconocimiento: se vuelve a Monitoreando con una evaluación normal.</text>
<text x="60" y="980" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#142f41" text-anchor="start" font-weight="normal">Normal = False; alerta = True. iniciar evalúa la medición inicial (paso interno por Monitoreando omitido).</text>
</svg>